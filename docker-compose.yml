# Certko — PostgreSQL (CMS data) + local uploads volume
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: certko
      POSTGRES_PASSWORD: certko
      POSTGRES_DB: certko
    ports:
      - "5432:5432"
    volumes:
      - certko_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certko -d certko"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  certko_pg:
